<!-- // public/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VideoCaller</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="lobby" class="screen active">
    <div class="lobby-container">
      <div class="rooms-header">
        <h2>Active Rooms</h2>
      </div>
      <div id="roomsGrid" class="rooms-grid"></div>
      <div id="lobbyStatus" class="status-text"></div>
    </div>
  </div>

  <div id="nameModalOverlay" class="modal-overlay">
    <div class="modal-card">
      <h2>Welcome</h2>
      <p>Please enter your name to continue</p>
      <input type="text" id="nameModalInput" placeholder="Your name" autocomplete="off" />
      <div class="modal-actions">
        <button id="nameModalConfirmBtn" class="btn primary">Continue</button>
      </div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 id="modalTitle">Create Room</h2>
      <p id="modalDesc">Enter a name for your new room</p>
      <input type="text" id="modalRoomInput" placeholder="e.g. standup, family-chat" autocomplete="off" />
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn secondary">Cancel</button>
        <button id="modalConfirmBtn" class="btn primary">Join</button>
      </div>
    </div>
  </div>

  <div id="callScreen" class="screen">
    <div class="top-bar">
      <div class="top-left">
        <span id="roomBadge" class="badge"></span>
        <span id="callStatus" class="status-pill">Connecting...</span>
      </div>
      <div class="top-actions">
        <button id="toggleChatBtn" class="icon-pill-btn" aria-label="Toggle Messages" title="Toggle Messages">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
          </svg>
        </button>
        <button id="fullscreenBtn" class="icon-pill-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div id="chatOverlay" class="chat-overlay hidden">
      <div id="chatMessages" class="chat-messages"></div>
    </div>

    <div class="bottom-area">
      <form id="chatForm" class="chat-input-bar hidden">
        <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" />
        <button type="submit" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>

      <div class="bottom-controls">
        <button id="muteAudioBtn" class="control-btn" aria-label="Mute Microphone">
          <svg id="micIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
        </button>

        <button id="leaveBtn" class="control-btn end-call" aria-label="End Call">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
          </svg>
        </button>

        <button id="muteVideoBtn" class="control-btn" aria-label="Toggle Camera">
          <svg id="camIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
